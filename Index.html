<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Công cụ quy trình TK1 – TK2</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#101828;--mut:#5b6776;--line:#e1e6ed;--soft:#f7f9fb;--t1:#0e7c7b;--t2:#5b44d6;--ok:#17803d;--warn:#b45309;--code:#0f172a;--codeink:#e2e8f0;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1016;--card:#141b23;--ink:#e6ebf1;--mut:#93a1b1;--line:#232e3a;--soft:#101720;--t1:#34c3b3;--t2:#a597ff;--ok:#5fd07c;--warn:#f0b35a;--code:#0a0f15;--codeink:#d5dde6;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar1{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
h1{font-size:16px;margin:0;font-weight:650}.sub{font-size:12.5px;color:var(--mut)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:200px}.pb{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}#pt{font-size:12.5px;color:var(--mut);white-space:nowrap}
.tabs{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:4px}
.tab{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}.tab.on{color:var(--ink);border-bottom-color:var(--c)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}.cnt{font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--mut)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px 48px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:8px}
.list h3{margin:6px 8px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:9px 10px;border-radius:7px;cursor:pointer}
.it:hover{background:var(--soft)}.it.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--c)}
.it b{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-size:11.5px;flex:none}
.it.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.it span{font-weight:550;font-size:13.5px}
.note{margin:10px 8px 4px;padding:9px 10px;background:var(--soft);border:1px dashed var(--line);border-radius:7px;font-size:12.5px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);overflow:hidden;border-top:3px solid var(--c)}
.hd{padding:18px 22px 6px}.chip{display:inline-block;background:var(--c);color:#fff;font-size:11.5px;font-weight:650;padding:2px 10px;border-radius:99px}
.hd h2{margin:8px 0 2px;font-size:19px;letter-spacing:-.01em}.why{margin:0;color:var(--mut);font-size:13.5px}
.body{padding:12px 22px 20px;display:flex;flex-direction:column;gap:16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cards div{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}.cards b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin-bottom:3px}
label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink)}
textarea{min-height:140px;max-height:480px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:600;font-size:13px;flex-wrap:wrap}
.meta{font-weight:400;font-size:12px;color:var(--mut)}.meta.w{color:var(--warn)}
.out{white-space:pre-wrap;word-break:break-word;padding:14px 16px;font:12.5px/1.6 ui-monospace,Consolas,monospace;margin:0;background:var(--code);color:var(--codeink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{margin-left:auto}
button.p{background:var(--c);color:#fff;border:0;padding:8px 16px;border-radius:7px;font:inherit;font-weight:650;cursor:pointer}
button.g{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 13px;border-radius:7px;font:inherit;cursor:pointer}button.g:hover:not(:disabled){background:var(--soft)}button:disabled{opacity:.45;cursor:default}
button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--c,var(--t1));outline-offset:2px}
.msg{color:var(--ok);font-size:12.5px}
.gg{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.gg h3{font-size:14px;margin:0 0 4px}.gg p,.gg li{margin:0;color:var(--mut);font-size:13.5px}.gg ul{margin:0;padding-left:18px}.gg .w{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}
dl{margin:0;display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13.5px}dt{font-weight:600}dd{margin:0;color:var(--mut)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.cards,.grid2,.gg,dl{grid-template-columns:1fr}.bar1,.tabs,.wrap{padding-left:14px;padding-right:14px}.prog{min-width:120px}.sub{display:none}}
</style>
</head>
<body>
<header class="top">
<div class="bar1"><div class="logo">T2</div><div><h1>Quy trình làm app với hai tài khoản Claude</h1><div class="sub">TK1 lập kế hoạch và chạy thử · TK2 chỉ code · Bạn chuyển file và tin nhắn giữa hai bên</div></div>
<div class="prog"><div class="pb"><i id="pf"></i></div><span id="pt"></span></div><button class="g" id="reset">Xóa dữ liệu</button></div>
<div class="tabs" id="tabs" role="tablist"></div>
</header>
<div class="wrap" id="app"></div>
<template id="gt"><div class="gg">
<div><h3>Vì sao phải chia nhiều bước</h3><p>Mỗi cuộc chat Claude không nhớ gì từ cuộc chat trước. Vì vậy mọi thứ được lưu thành file (đặc tả, gói zip) và bạn đính kèm lại ở cuộc chat sau.</p></div>
<div><h3>Hai tài khoản, hai vai</h3><p>TK1 viết đặc tả, soạn phiếu giao việc, đăng và thử app. TK2 chỉ code theo phiếu, không bàn kế hoạch. Tách vai giúp mỗi bên làm gọn và dễ kiểm tra.</p></div>
<div><h3>Việc của bạn</h3><p>Mở đúng tài khoản, đính kèm đúng file, sao chép tin nhắn từ công cụ này, dán vào Claude, rồi tải kết quả về. Làm lần lượt từng bước, bấm "Đánh dấu đã xong" để biết mình đang ở đâu.</p></div>
<div class="w"><h3>Chuẩn bị trước khi bắt đầu</h3><ul><li>Hai tài khoản Claude, đăng nhập sẵn ở hai trình duyệt hoặc hai hồ sơ trình duyệt khác nhau để khỏi nhầm.</li><li>Ở cả hai tài khoản: Settings, Capabilities, bật "Code execution and file creation".</li><li>Một thư mục trên máy để lưu mọi file tải về; đặt tên zip theo giai đoạn (work_g1.zip, work_g2a.zip) và giữ lại các bản cũ.</li><li>Nếu nâng cấp app có sẵn: file HTML của app đó.</li></ul></div>
<div class="w"><h3>Các từ hay gặp</h3><dl><dt>Đặc tả (DAC_TA.md)</dt><dd>Bản mô tả chi tiết app cần làm, là bản thiết kế chung mà mọi cuộc chat đều đọc.</dd><dt>Giai đoạn</dt><dd>Phần việc đủ nhỏ để một cuộc chat làm xong.</dd><dt>Phiếu giao việc</dt><dd>Một tờ giao một giai đoạn cho TK2, ghi rõ làm gì, không làm gì, nghiệm thu thế nào.</dd><dt>Zip điểm lưu</dt><dd>Gói lưu tiến độ TK2 tạo sau mỗi việc nhỏ, để hết hạn mức giữa chừng không mất công.</dd><dt>PROGRESS.md</dt><dd>Sổ tiến độ nằm trong zip: đã làm gì, việc tiếp theo.</dd><dt>Artifact</dt><dd>Trang app được đăng trên claude.ai để chạy thử và dùng.</dd></dl></div>
</div></template>
<script>
const TPL={"m1": "VAI TRÒ: Bạn là NGƯỜI LẬP KẾ HOẠCH (kiến trúc sư phần mềm). Trong cuộc chat này CHỈ VIẾT ĐẶC TẢ,\nKHÔNG VIẾT CODE, không sửa file HTML.\n\nTÔI MUỐN: {{desc}}\nNGƯỜI DÙNG: {{user}}\nTHIẾT BỊ: {{dev}}\nLOẠI: {{kind}}\nApp là MỘT file HTML chạy trên claude.ai (artifact), gọi được Claude qua window.claude.\n\nVIỆC CẦN LÀM:\n1. Nếu là nâng cấp: đọc app đính kèm để hiểu kiến trúc hiện có (đọc theo khoảng dòng bằng grep/sed,\n   không mở cả file một lần). Ghi lại các khối chính, cách gọi AI, cách lưu dữ liệu, giao diện.\n2. Tra các chuẩn hoặc quy định liên quan (nếu có). Chỗ nào không chắc thì ghi \"cần đối chiếu\",\n   KHÔNG được bịa số liệu.\n3. Đề xuất kiến trúc và liệt kê rủi ro. KHÔNG hỏi lại tôi: tự chọn mặc định hợp lý và nêu rõ\n   những mặc định đã chọn để tôi sửa sau.\n4. Viết file DAC_TA.md (tiếng Việt), đủ chi tiết để một cuộc chat khác làm theo, gồm các mục:\n   0. Bối cảnh và mục tiêu\n   1. Kiến trúc hiện có và ràng buộc môi trường\n   2. Cách làm qua nhiều cuộc chat (chép NGUYÊN VĂN khối \"CÁCH LÀM BẮT BUỘC\" ở cuối tin nhắn này)\n   3. Schema dữ liệu\n   4. Tính năng (chi tiết, kèm quy tắc nghiệp vụ và ví dụ)\n   5. Prompt cho AI (nếu app có gọi AI): viết đầy đủ nội dung prompt\n   6. Giai đoạn thực hiện kèm tiêu chí nghiệm thu: Giai đoạn 0 khảo sát (nếu nâng cấp); Giai đoạn 1\n      lõi dữ liệu và logic có test; các giai đoạn sau theo tính năng. MỖI GIAI ĐOẠN ĐỦ NHỎ để một\n      cuộc chat làm xong. Mỗi giai đoạn có tiêu chí nghiệm thu kiểm tra được và yêu cầu hồi quy.\n   7. Báo cáo cuối (đã làm, test, chỗ lệch, chỗ chưa thử được, giới hạn)\n   Ghi rõ chỗ nào \"cần đối chiếu\". Nếu nâng cấp: nguyên tắc là THÊM module mới, không làm hỏng\n   chức năng cũ, giữ đúng phong cách giao diện hiện có.\n5. Mục ràng buộc môi trường phải ghi: trang đã đăng trên claude.ai chỉ nạp script (thẻ <script>)\n   từ cdnjs.cloudflare.com, cdn.jsdelivr.net/npm, cdn.tailwindcss.com, code.jquery.com và PHẢI\n   GHIM đúng phiên bản; không tải được stylesheet hoặc font ngoài (trừ Google Fonts); không gọi\n   mạng ra site khác; cách gọi AI và lưu trữ trong trang đã đăng có thể khác bản xem thử trong\n   chat, nên nếu nâng cấp thì giữ đúng cách app hiện đang dùng và ghi rõ.\n6. Cuối cùng cho tôi tải file DAC_TA.md.\n\n=== KHỐI \"CÁCH LÀM BẮT BUỘC\" (chép nguyên văn vào mục 2 của đặc tả) ===\nMôi trường: file không tồn tại giữa các cuộc chat. Mọi thứ phải lưu thành file tải về (thư mục\noutputs + công cụ trình bày file); người dùng đính kèm lại ở cuộc chat sau. Hạn mức của người dùng\ncó thể hết giữa chừng: luôn lưu tiến độ trước khi hết lượt.\n1. Không soạn code mới trực tiếp trong file HTML lớn. Tạo thư mục src/ gồm các file nguồn,\n   mock-claude.js (giả lập window.claude, gồm cả đầu ra xấu: JSON hỏng, thiếu trường, đáp án sai),\n   file test, và build.py. build.py ghép src/ thành file HTML đầu ra. Nếu nâng cấp app có sẵn: đọc\n   bản gốc (không bao giờ sửa), chèn khối mới giữa <!-- NEW:BEGIN --> ... <!-- NEW:END -->, và tự\n   kiểm tra rằng gỡ các khối này ra thì khớp đúng bản gốc. Chú ý quy ước thoát ký tự nếu chèn\n   vào các khối <script type=\"text/plain\"> của app.\n2. Không mở cả file lớn một lần: dùng grep -n và đọc theo khoảng dòng. Không in code dài vào câu\n   trả lời; viết thẳng vào file, báo cáo ngắn.\n3. Mỗi cuộc chat làm một phần việc vừa sức. Sắp hết ngữ cảnh hoặc hết lượt thì dừng ở điểm an toàn\n   và lưu tiến độ.\n4. Bàn giao cuối mỗi cuộc chat (kể cả khi dừng giữa chừng): cập nhật PROGRESS.md (đã làm gì, quyết\n   định thiết kế, khóa lưu trữ mới, lỗi tồn đọng, VIỆC TIẾP THEO cụ thể); đóng gói work.zip gồm\n   src/, PROGRESS.md, bản gốc (nếu có), bản build; nói rõ cần đính kèm file nào ở chat sau.\n5. Đầu mỗi cuộc chat tiếp theo: giải nén, đọc PROGRESS.md trước, chạy lại build và test, rồi làm\n   đúng \"việc tiếp theo\".\n6. Tự kiểm tra: test đơn vị cho logic quan trọng; mock-claude.js để thử luồng có gọi AI; trình\n   duyệt headless nếu có. Môi trường chat có thể không có mạng: không phụ thuộc gói cài thêm.\n   Phần gọi AI thật chỉ chạy được khi app nằm trên claude.ai: ghi rõ trong báo cáo phần nào\n   chưa thử được.\n=== HẾT KHỐI ===", "m2": "Soạn PHIẾU GIAO VIỆC cho giai đoạn {{n}} để đưa cho một Claude khác chỉ làm nhiệm vụ code.\nCÁCH GIAO: {{mode}}.\nNếu là TIẾP TỤC CHAT CŨ: người code đã có file và đã biết dự án, nên viết phiếu NGẮN: bỏ mục 4 (file đính kèm), không nhắc lại bối cảnh, chỉ ghi việc mới, không làm gì, nghiệm thu và bàn giao.\nNgười code KHÔNG biết gì ngoài các file đính kèm và phiếu này, nên phiếu phải tự đủ. Phiếu gồm:\n1. Giai đoạn và mục tiêu (một đoạn).\n2. Phạm vi: chỉ làm những việc nào (liệt kê theo thứ tự, việc quan trọng và việc nền đặt trước); không làm gì (liệt kê).\n   Chia thành các VIỆC CON nhỏ (tối đa 4 đến 5 việc con), sau mỗi việc con là một ĐIỂM LƯU (checkpoint).\n   Nếu giai đoạn quá lớn thì tách thành phiếu a và phiếu b, đừng nhồi vào một phiếu.\n3. Mục của đặc tả cần đọc kỹ (ghi số mục).\n4. File cần đính kèm khi giao việc.\n5. Tiêu chí nghiệm thu cụ thể, kiểm tra được (kể cả hồi quy, kể cả các ca đầu vào xấu cần test).\n6. Yêu cầu bàn giao: cập nhật PROGRESS.md, đóng gói zip, và báo cáo cuối gồm: đã làm, kết quả\n   test, chỗ lệch đặc tả, chỗ chưa thử được, việc tiếp theo, và các bước tôi cần làm khi thử\n   thật trên claude.ai (nếu giai đoạn này có phần gọi AI hoặc giao diện).\nViết ngắn gọn, đúng thứ tự trên, để tôi copy nguyên văn sang người code.\n\nĐỊNH DẠNG ĐẦU RA (bắt buộc): đặt TOÀN BỘ nội dung phiếu trong MỘT khối code duy nhất để tôi bấm nút Copy. Mở và đóng khối bằng bốn dấu huyền (````) để các khối code bên trong phiếu không làm vỡ khung. Không viết gì khác bên trong khối. Nếu cần nhận xét thì viết NGẮN, đặt ngoài khối.", "m3": "Bạn là NGƯỜI CODE. Chỉ làm đúng phiếu giao việc bên dưới theo file đặc tả đính kèm (DAC_TA.md).\nKhông bàn kế hoạch, không đổi đặc tả. Nếu đã có zip đính kèm: giải nén, đọc PROGRESS.md trước, chạy\nlại build và test để xác nhận trạng thái rồi mới làm.\n\nQUY TẮC LƯU ĐIỂM (bắt buộc, vì hạn mức của tôi có thể hết bất cứ lúc nào):\n- Chia phiếu thành các việc con. SAU MỖI VIỆC CON xong (build và test chạy được): cập nhật PROGRESS.md,\n  đóng gói zip điểm lưu (work_ckpt_1.zip, work_ckpt_2.zip...) vào thư mục outputs và TRÌNH BÀY FILE NGAY\n  (present_files), rồi mới làm việc con tiếp theo. File chưa trình bày coi như mất.\n- Tiết kiệm lượt: viết code thẳng vào file, không in code dài vào câu trả lời; kết quả lệnh chỉ in\n  phần cần thiết (head, tail, grep); không đọc cả file lớn; không giải thích dài dòng giữa chừng.\n- Nếu thấy phiếu quá lớn cho một lượt, báo ngay một dòng rồi chỉ làm phần đầu và lưu điểm lưu.\n- Cuối cùng cho tôi tải zip cuối và đưa báo cáo theo đúng mục \"bàn giao\" trong phiếu.\n- ĐỊNH DẠNG BÁO CÁO (bắt buộc): đặt TOÀN BỘ báo cáo cuối trong MỘT khối code duy nhất để tôi bấm nút Copy dán sang người lập kế hoạch. Mở và đóng khối bằng bốn dấu huyền (````). Không viết gì khác bên trong khối. Nếu dừng giữa chừng vì sắp hết lượt thì cũng báo cáo theo cách này (ghi rõ đã xong tới đâu và việc tiếp theo).\n\n--- PHIẾU GIAO VIỆC ---\n{{phieu}}", "m3b": "Tiếp tục dự án trong chat này, vẫn với vai NGƯỜI CODE. Làm đúng phiếu giao việc bên dưới theo DAC_TA.md và PROGRESS.md đang có trong thư mục làm việc. Không bàn kế hoạch, không đổi đặc tả.\nBắt đầu bằng việc chạy lại build và test để xác nhận trạng thái, rồi mới làm.\nGiữ nguyên quy tắc lưu điểm lưu và định dạng báo cáo như đã nêu ở đầu chat (sau mỗi việc con: cập nhật PROGRESS.md, đóng gói zip, trình bày file; báo cáo cuối trong MỘT khối code bốn dấu huyền). Nếu ngữ cảnh sắp đầy thì báo ngay một dòng và lưu điểm lưu để tôi chuyển sang chat mới.\n\n--- PHIẾU GIAO VIỆC ---\n{{phieu}}", "m4": "Đây là báo cáo của người code cho giai đoạn {{n}}. Đánh giá theo bảng kiểm: (1) test có chạy và đạt\nkhông, bao nhiêu ca; (2) có chạy hồi quy phần cũ không; (3) chỗ lệch đặc tả có hợp lý không;\n(4) mục \"chưa thử được\"; (5) PROGRESS.md có việc tiếp theo cụ thể không. Nêu rủi ro hoặc việc phải\nsửa trước khi sang giai đoạn sau. Sau đó soạn PHIẾU GIAO VIỆC cho giai đoạn tiếp theo (hoặc PHIẾU SỬA\nLỖI nếu chưa đạt), theo đúng mẫu phiếu trước.\nCÁCH GIAO phiếu tiếp theo: {{mode}}. Nếu là TIẾP TỤC CHAT CŨ thì viết phiếu NGẮN (bỏ mục file đính kèm, không nhắc lại bối cảnh).\n\nĐỊNH DẠNG ĐẦU RA (bắt buộc): phần đánh giá viết bình thường. Riêng PHIẾU (giao việc hoặc sửa lỗi) phải nằm trọn trong MỘT khối code duy nhất để tôi bấm nút Copy, mở và đóng bằng bốn dấu huyền (````). Không viết gì khác bên trong khối.\n\n--- BÁO CÁO CỦA NGƯỜI CODE ---\n{{bao_cao}}", "m5": "Đây là bản mới của app. Hãy đăng lên claude.ai và cập nhật vào artifact cũ có link: {{link}}.\nNếu chưa có artifact cũ thì tạo mới. Sau đó cho tôi link. Tôi sẽ thử và báo lỗi.", "m6": "Tôi đã thử bản mới trên claude.ai và gặp các lỗi sau:\n{{loi}}\nSoạn PHIẾU SỬA LỖI cho người code: mô tả từng lỗi (cách tái hiện, kết quả đúng mong muốn), thứ tự\nưu tiên, file cần đính kèm, tiêu chí nghiệm thu, và yêu cầu bàn giao như các phiếu trước. Người code\nkhông biết gì ngoài file đính kèm.\n\nĐỊNH DẠNG ĐẦU RA (bắt buộc): đặt TOÀN BỘ phiếu sửa lỗi trong MỘT khối code duy nhất để tôi bấm nút Copy, mở và đóng bằng bốn dấu huyền (````). Không viết gì khác bên trong khối.", "m7": "Bạn là NGƯỜI LẬP KẾ HOẠCH của dự án này (chỉ viết đặc tả và phiếu giao việc, KHÔNG viết code). Đặc tả\nlà DAC_TA.md, tiến độ nằm trong PROGRESS.md (đính kèm). Dự án đã làm đến giai đoạn {{n}}. Đọc cả hai\nfile, tóm tắt trạng thái trong 5 dòng, rồi chờ tôi gửi báo cáo hoặc yêu cầu tiếp theo."};

const nx=S[st.c+1],pv=S[st.c-1];
$('pn').innerHTML='<div class="hd"><span class="chip">TK'+a+' · bước '+(st.c+1)+'/'+S.length+'</span><h2>'+s.t+'</h2><p class="why">'+W[st.c]+'</p></div><div class="body"><div class="cards"><div><b>1. Mở</b>'+C.o+'</div><div><b>2. Đính kèm</b>'+C.at+'</div><div><b>3. Sau khi nhận kết quả</b>'+C.af+'</div></div><div class="grid2" id="fs"></div><div class="box"><div class="bh"><span>Tin nhắn để dán vào Claude</span><span class="meta" id="mt"></span><button class="p" id="cp">Sao chép</button></div><pre class="out" id="out"></pre></div><div class="acts"><button class="g" id="pv"></button><button class="g ok" id="dn"></button><button class="g" id="nx"></button><span class="msg sp" id="ms" role="status"></span></div></div>';
const show=()=>{const t=gen(st.c),m=(t.match(/【/g)||[]).length;$('out').textContent=t;$('mt').textContent=t.length.toLocaleString('vi')+' ký tự'+(m?' · còn '+m+' ô chưa điền':'');$('mt').className='meta'+(m?' w':'')};
s.f.forEach(k=>{const f=F[k],d=document.createElement('div');if(f.ta)d.style.gridColumn='1/-1';const id='f_'+k;d.innerHTML='<label for="'+id+'">'+f.l+'</label>'+(f.sel?'<select id="'+id+'">'+f.sel.map(o=>'<option>'+o+'</option>').join('')+'</select>':f.ta?'<textarea id="'+id+'"></textarea>':'<input id="'+id+'" placeholder="'+(f.ph||'')+'">');$('fs').appendChild(d);const e=d.querySelector('#'+id);if(f.sel&&!st.v[k])st.v[k]=f.sel[0];e.value=st.v[k]||'';
const grow=()=>{if(f.ta){e.style.height='auto';e.style.height=Math.min(e.scrollHeight+4,480)+'px'}};grow();e.oninput=()=>{st.v[k]=e.value;save();if(k=='mode'){draw();return}grow();show()}});
show();
const dn=$('dn'),lab=()=>{dn.textContent=st.d[st.c]?'✓ Đã xong (bấm để bỏ)':'Đánh dấu đã xong';dn.classList.toggle('on',!!st.d[st.c])};lab();dn.onclick=()=>{st.d[st.c]=!st.d[st.c];save();lab();head();const it=$('li').children[S.filter((x,i)=>x.a==a&&i<=st.c).length-1];if(it){it.classList.toggle('done',!!st.d[st.c]);it.firstChild.textContent=st.d[st.c]?'✓':st.c+1}};
$('pv').textContent=pv?'← Bước '+st.c+' · TK'+pv.a:'← Bước trước';$('pv').disabled=!pv;$('pv').onclick=()=>go(st.c-1);
$('nx').textContent=nx?'Bước '+(st.c+2)+' · TK'+nx.a+' →':'Bước sau →';$('nx').disabled=!nx;$('nx').onclick=()=>go(st.c+1);
$('cp').onclick=async()=>{const t=gen(st.c);let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{ok=document.execCommand('copy')}catch(e2){}x.remove()}$('ms').textContent=ok?'Đã sao chép đầy đủ '+t.length.toLocaleString('vi')+' ký tự.':'Không sao chép được: bôi đen khung tin nhắn rồi nhấn Ctrl+C.'}}
$('reset').onclick=()=>{if(confirm('Xóa toàn bộ dữ liệu đã nhập và tiến độ?')){st={v:{},d:{},c:0,tab:1,last:{1:0,2:2}};save();draw()}};
draw();
</script>
